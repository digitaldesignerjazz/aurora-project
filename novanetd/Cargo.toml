[package]
name = "novanetd"
version = "0.1.0"
edition = "2021"
authors = ["Sven Normen Esslinger <sven@esslinger.co>"]
description = "NovaNet v0.1 reference implementation - sovereign mesh networking daemon (Aurora Project)"
license = "MIT"
repository = "https://github.com/digitaldesignerjazz/aurora-project"
keywords = ["mesh", "networking", "privacy", "yggdrasil", "aurora", "novanet"]
categories = ["network-programming", "cryptography"]

[dependencies]
tokio = { version = "1.38", features = ["full", "rt-multi-thread"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8"] }
snow = "0.9"
blake3 = "1.5"
rand = "0.8"
chacha20poly1305 = "0.10"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tun2 = { version = "1.0", optional = true }
mdns-sd = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
fastbloom = "0.8"
anyhow = "1.0"

[features]
default = ["tun"]
tun = ["dep:tun2"]

[[bin]]
name = "novanetd"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true